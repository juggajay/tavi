# The bots' Linux space (WSL2 distro "lh-bots"). Installed to /etc/wsl.conf by box/setup.sh.
# Everything here is about keeping what runs inside away from the Windows PC:
#   - no Windows drives mounted (C:, D: are not visible in here)
#   - no starting Windows programs from in here
#   - a root-owned boot script closes the remaining doors (see boot.sh)
# A bot runs as its own Linux user with no sudo, so it cannot undo any of this.

[boot]
systemd=false
command=bash /opt/lh/boot.sh; bash /opt/lh/screen/boot.sh >> /var/log/lh-screen-boot.log 2>&1

[automount]
enabled=false
mountFsTab=false

[interop]
enabled=false
appendWindowsPath=false

[network]
hostname=lh-bots
generateResolvConf=true

[user]
default=root
