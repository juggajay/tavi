<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Tavi</title>
<style>
  :root { --bg: #f6f6f4; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e3df; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --ink: #ededea; --muted: #a3a29c; --line: #2c2c2a; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .box { text-align: center; max-width: 440px; padding: 24px; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; font-weight: 600; margin: 14px 0 6px; }
  p { color: var(--muted); margin: 0 0 16px; }
  .dots span { display: inline-block; width: 7px; height: 7px; margin: 0 3px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite cubic-bezier(.32,.72,0,1); }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  a { color: var(--ink); }
  code { font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .failed .dots { display: none; }
</style>
</head>
<body>
  <div class="box">
    <img src="assets/tavi.ico" alt="">
    <h1 id="t">Starting Tavi</h1>
    <p id="m">Getting things going on this PC.</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("failed")) {
    document.body.classList.add("failed");
    document.getElementById("t").textContent = "Tavi didn't start";
    const m = document.getElementById("m");
    m.textContent = "Try “Start Tavi” from the tray icon. If it still won't start, the reason is in ";
    const c = document.createElement("code");
    c.textContent = q.get("log") || "data\\logs\\gateway.log";
    m.appendChild(c);
  }
</script>
</body>
</html>
