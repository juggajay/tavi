<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavi</title>
<meta name="theme-color" content="#0F1113">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tavi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
/* One screen: a real-time 3D character centre stage, one subtitle line, discreet controls top right. */
:root{
  --bg:#E7E9E8; --floor:#D3D7D6; --spot:rgba(255,255,255,.9); --ink:#16191B; --muted:#6B7270; --accent:#EF6A1F;
  --chip:rgba(255,255,255,.55); --chip-line:rgba(22,25,27,.08);
  --surface:#FBFBFA; --shell:rgba(255,255,255,.5); --shell-line:rgba(22,25,27,.07); --inner-hi:rgba(255,255,255,.9); --shadow-soft:rgba(40,48,52,.35);
  --scrim:rgba(214,218,217,.7);
  --grain:.05; --grain-blend:multiply;
  --on-accent:#1B0D04;
  --ease:cubic-bezier(.32,.72,0,1);
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1113; --floor:#060708; --spot:rgba(150,160,168,.17); --ink:#ECEEEC; --muted:#8E9592; --accent:#FF7A33;
  --chip:rgba(255,255,255,.06); --chip-line:rgba(255,255,255,.08);
  --surface:#1A1D20; --shell:rgba(255,255,255,.05); --shell-line:rgba(255,255,255,.08); --inner-hi:rgba(255,255,255,.06); --shadow-soft:rgba(0,0,0,.7);
  --scrim:rgba(7,8,10,.7);
  --grain:.06; --grain-blend:overlay;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font:400 16px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-color:var(--bg);
  background-image:radial-gradient(58% 46% at 50% 40%,var(--spot),transparent 72%),linear-gradient(180deg,var(--bg) 0%,var(--bg) 60%,var(--floor) 100%);
}
button{font:inherit;color:inherit}
.grain{position:fixed;inset:0;pointer-events:none;opacity:var(--grain);mix-blend-mode:var(--grain-blend);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.app{min-height:100%;display:grid;grid-template-rows:auto auto auto;align-content:center;justify-items:center;padding-block:56px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.avatar{position:relative;width:min(92vw,60vh,600px);aspect-ratio:1;max-width:100%;border:0;background:none;padding:0;cursor:pointer;border-radius:40%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.avatar canvas{position:relative;z-index:1;display:block;width:100%;height:100%;opacity:0;transition:opacity .9s var(--ease)}
.ready .avatar canvas{opacity:1}
.avatar:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.rings{position:absolute;inset:0;z-index:0;pointer-events:none}
.rings span{position:absolute;left:50%;top:49%;width:58%;aspect-ratio:1;border-radius:50%;border:2px solid var(--accent);opacity:0;transform:translate(-50%,-50%) scale(.8)}
[data-state="listening"] .rings span{animation:ring 2.1s cubic-bezier(.22,.61,.36,1) infinite}
.rings span:nth-child(2){animation-delay:.7s}.rings span:nth-child(3){animation-delay:1.4s}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;transition:opacity .5s var(--ease)}
.ready .loading{opacity:0}

.captions{width:100%;max-width:34ch;text-align:center;margin-top:4px;min-height:9.2em;display:grid;align-content:start;gap:10px}
.you{font-size:15px;color:var(--muted);min-height:1.5em;text-wrap:balance}
.say{font-size:clamp(20px,2.3vw,25px);font-weight:500;letter-spacing:-.012em;line-height:1.34;text-wrap:balance;min-height:2.7em}
.say .w{display:inline-block;opacity:0;transform:translateY(5px);filter:blur(3px);transition:opacity .45s var(--ease),transform .45s var(--ease),filter .45s var(--ease)}
.say .w.on{opacity:1;transform:none;filter:none}
.think{display:inline-block;font-size:17px;font-weight:400;color:transparent;background:linear-gradient(90deg,var(--muted) 0%,var(--ink) 45%,var(--muted) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:shimmer 1.6s linear infinite}
.hint{font-size:13px;color:var(--muted);letter-spacing:.02em;min-height:1.3em;transition:opacity .4s var(--ease)}
.hint:empty{opacity:0}

.controls{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:2}
.pill-btn{border:0;border-radius:999px;padding:8px 14px;background:var(--chip);box-shadow:0 0 0 1px var(--chip-line);color:var(--muted);font-size:13px;cursor:pointer;transition:color .2s var(--ease),transform .2s var(--ease)}
.pill-btn:hover,.pill-btn[aria-expanded="true"]{color:var(--ink)}
.pill-btn:active{transform:scale(.97)}
.pill-btn:focus-visible,.done:focus-visible,.tb-send:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.scrim{position:fixed;inset:0;background:linear-gradient(180deg,transparent 35%,var(--scrim) 100%);opacity:0;pointer-events:none;transition:opacity .6s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(calc(100% + 32px));transition:transform .8s var(--ease);pointer-events:none}
.sheet.open{transform:none}
.sheet.open .shell{pointer-events:auto}
.shell{width:100%;max-width:540px;padding:6px;border-radius:30px;background:var(--shell);box-shadow:0 0 0 1px var(--shell-line),0 34px 70px -24px var(--shadow-soft);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.core{border-radius:24px;overflow:hidden;background:var(--surface);box-shadow:inset 0 1px 0 var(--inner-hi)}
.card-body{padding:18px 18px 4px}
.card-body h3{margin:0 0 12px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.card-body dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 18px;font-size:15px}
.card-body dt{color:var(--muted)}
.card-body dd{margin:0;font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}
.card-body img.drawing,.appr img.drawing{display:block;width:100%;max-height:52vh;object-fit:contain;border-radius:14px;background:#fff;margin:0 0 6px;box-shadow:0 0 0 1px var(--shell-line);cursor:zoom-in}
/* Full-screen drawing viewer: pinch / drag / double-tap, and a close button that's always reachable. */
.viewer{position:fixed;inset:0;z-index:30;background:#0d0f10;display:none;touch-action:none;overflow:hidden;-webkit-user-select:none;user-select:none}
.viewer.open{display:block}
.viewer img{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;-webkit-user-drag:none;will-change:transform}
.viewer-bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(13,15,16,.88),rgba(13,15,16,0));color:#eceeec;font-size:14px;pointer-events:none}
.viewer-bar span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-x{pointer-events:auto;flex:none;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:20px;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .2s var(--ease)}
.viewer-x:active{transform:scale(.94)}
.viewer-x:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.viewer-hint{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:rgba(236,238,236,.72);font-size:13px;pointer-events:none;transition:opacity .6s var(--ease)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 12px 12px 18px}
.meta span{font-size:13px;color:var(--muted);min-width:0}
.done{border:0;border-radius:999px;padding:10px 20px;background:var(--ink);color:var(--surface);font-size:14px;font-weight:500;cursor:pointer;flex:none;transition:transform .2s var(--ease)}
.done:active{transform:scale(.97)}
.sheet.is-approval .meta{display:none}
.appr{padding:18px 18px 16px;display:grid;gap:12px}
.appr h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.appr dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:15px}
.appr dt{color:var(--muted)}
.appr dd{margin:0;overflow-wrap:anywhere}
.appr-body{margin:0;padding:12px 14px;border-radius:16px;background:var(--bg);font-size:15px;line-height:1.45;white-space:pre-wrap;max-height:32vh;overflow:auto}
.appr-actions{display:flex;gap:8px;justify-content:flex-end}
.btn-ghost{border:0;border-radius:999px;padding:11px 18px;background:transparent;box-shadow:0 0 0 1px var(--shell-line) inset;color:var(--ink);font-size:15px;cursor:pointer}
.btn-go{border:0;border-radius:999px;padding:11px 20px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600;cursor:pointer;transition:transform .2s var(--ease)}
.btn-go:active{transform:scale(.97)}
.btn-go:disabled,.btn-ghost:disabled{opacity:.5;cursor:default}
.btn-go:focus-visible,.btn-ghost:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.typebar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(calc(100% + 24px));transition:transform .6s var(--ease);pointer-events:none}
.tb-shell{width:100%;max-width:520px;padding:5px;border-radius:999px;background:var(--shell);box-shadow:0 0 0 1px var(--shell-line),0 24px 50px -22px var(--shadow-soft);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.tb-core{display:flex;align-items:center;gap:6px;border-radius:999px;background:var(--surface);box-shadow:inset 0 1px 0 var(--inner-hi);padding:5px 5px 5px 18px;transition:box-shadow .2s var(--ease)}
.tb-core:focus-within{box-shadow:inset 0 1px 0 var(--inner-hi),0 0 0 1.5px var(--accent)}
.tb-core input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 16px var(--f-ui);padding:9px 0;outline:none}
.tb-core input::placeholder{color:var(--muted)}
.tb-send{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);font:600 17px/1 var(--f-ui);cursor:pointer;display:grid;place-items:center;transition:transform .2s var(--ease),opacity .2s var(--ease)}
.tb-send:active{transform:scale(.94)}
.tb-send:disabled{opacity:.3;cursor:default}
.typing .typebar{transform:none}
.typing .typebar .tb-shell{pointer-events:auto}
.sheet-open .typebar{transform:translateY(calc(100% + 24px))}
.sheet-open .typebar .tb-shell{pointer-events:none}

/* While a card is open the avatar moves up and shrinks (below the pills), so the card never sits on top of it.
   It stays live: tap it to keep talking. Its subtitles sit just under it, trimmed to three lines. */
.sheet-open .app{align-content:start;min-height:0;padding-top:calc(62px + env(safe-area-inset-top,0px))}
.sheet-open .avatar{width:min(36vw,22vh,190px)}
.sheet-open .captions{min-height:0;max-width:32ch;margin-top:2px;gap:4px}
.sheet-open .you,.sheet-open .hint{display:none}
.sheet-open .say{font-size:16px;line-height:1.35;min-height:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sheet-open .scrim{pointer-events:none}
/* The card fits under the avatar and scrolls inside itself; the handle says it can be swiped away. */
.sheet .core{display:flex;flex-direction:column;max-height:max(240px,calc(100dvh - 170px - min(36vw,22vh,190px) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}
#sheetArt{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.grab{display:block;flex:none;width:38px;height:5px;border-radius:999px;background:var(--muted);opacity:.35;margin:9px auto 0}
.sheet-open .card-body img.drawing,.sheet-open .appr img.drawing{max-height:38dvh}
/* Typing while a card is open: the bar sits under the card, and the card gets shorter to make room. */
.sheet-open.typing .typebar{transform:none}
.sheet-open.typing .typebar .tb-shell{pointer-events:auto}
.sheet-open.typing .sheet{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
.sheet-open.typing .sheet .core{max-height:max(200px,calc(100dvh - 232px - min(36vw,22vh,190px) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}
.typing .app{padding-bottom:112px}

/* Cards are kept: a small bar on each card goes to the list or flips to the one before/after; the list is grouped by day. */
.card-nav{display:flex;align-items:center;gap:6px;margin:-6px -6px 8px 0}
.card-nav .to-list{border:0;background:none;padding:8px 8px 8px 0;margin-right:auto;color:var(--muted);font-size:14px;cursor:pointer;border-radius:10px}
.card-nav span{font-size:13px;color:var(--muted);white-space:nowrap}
.card-nav .step{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--bg);color:var(--ink);font:500 18px/1 var(--f-ui);cursor:pointer;display:grid;place-items:center;transition:transform .2s var(--ease),opacity .2s var(--ease)}
.card-nav .step:active{transform:scale(.94)}
.card-nav .step:disabled{opacity:.3;cursor:default}
.card-nav button:focus-visible,.card-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card-body figure{margin:0 0 10px}
.card-body figure img.drawing{margin:0}
.card-body figcaption{font-size:13px;color:var(--muted);margin:6px 2px 0}
.cards-list{padding:18px 10px 4px}
.cards-list h3{margin:0 8px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.cards-sub{margin:2px 8px 4px;font-size:14px;color:var(--muted)}
.cards-day{margin:14px 8px 4px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card-row{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:16px;cursor:pointer;transition:background-color .2s var(--ease)}
.card-row:active{background:var(--bg)}
.card-row .card-text{min-width:0;flex:1}
.card-row b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-row small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-thumb{flex:none;width:56px;height:56px;border-radius:12px;object-fit:cover;object-position:center;background:#fff;box-shadow:0 0 0 1px var(--shell-line)}
.card-thumb.text{display:grid;align-content:center;gap:6px;padding:0 13px;background:var(--bg)}
.card-thumb.text i{display:block;height:3px;border-radius:2px;background:var(--muted);opacity:.45}
.card-thumb.text i:nth-child(2){width:70%}
.cards-empty{margin:18px 8px 10px;color:var(--muted);font-size:15px}
.pill-btn.nudge{animation:nudge 1.2s var(--ease)}
@keyframes nudge{0%{transform:scale(1)}30%{transform:scale(1.12);color:var(--ink);box-shadow:0 0 0 1.5px var(--accent)}100%{transform:scale(1)}}

@keyframes ring{0%{opacity:.45;transform:translate(-50%,-50%) scale(.82)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
@keyframes shimmer{from{background-position:220% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:480px){.app{padding-block:56px 20px}.captions{min-height:10.5em}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="controls">
  <button class="pill-btn" id="alerts" type="button" hidden>Alerts</button>
  <button class="pill-btn" id="end" type="button" hidden>End</button>
  <button class="pill-btn" id="cards" type="button" hidden aria-controls="sheet">Cards</button>
  <button class="pill-btn" id="type" type="button" aria-expanded="false" aria-controls="typebar">Type</button>
  <button class="pill-btn" id="sound" type="button" aria-pressed="true">Sound on</button>
</div>

<main class="app" data-state="idle" id="app">
  <button class="avatar" id="avatar" type="button" aria-label="Talk to Tavi">
    <span class="rings" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="loading" id="loading">Waking up…</span>
    <canvas id="cv"></canvas>
  </button>
  <div class="captions" aria-live="polite">
    <div class="you" id="you"></div>
    <div class="say" id="say"></div>
  </div>
  <div class="hint" id="hint">Tap to talk</div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="shell"><div class="core">
    <span class="grab" aria-hidden="true"></span>
    <div id="sheetArt"></div>
    <div class="meta"><span id="sheetCap"></span><button class="done" id="done" type="button">Done</button></div>
  </div></div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Drawing" aria-hidden="true">
  <img id="viewer-img" alt="" draggable="false">
  <div class="viewer-bar"><span id="viewer-cap"></span><button class="viewer-x" id="viewer-x" type="button" aria-label="Close">✕</button></div>
  <div class="viewer-hint" id="viewer-hint">Pinch or double-tap to zoom</div>
</div>

<form class="typebar" id="typebar" autocomplete="off" inert>
  <div class="tb-shell"><div class="tb-core">
    <input id="tb-in" type="text" placeholder="Type a message" aria-label="Message" enterkeyhint="send">
    <button class="tb-send" id="tb-send" type="submit" aria-label="Send" disabled>↑</button>
  </div></div>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="/earlier.js"></script>
<script type="module">
let appName = "Tavi";
try {
  const reply = await fetch('/api/hq/state', { signal: AbortSignal.timeout(4000) });
  const state = reply.ok ? await reply.json() : null;
  if (state?.on !== true) appName = "Tavi";
} catch { appName = "Tavi"; }
// Choose the app's name before filling any of its pages.
const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
while (walk.nextNode()) {
  const node = walk.currentNode;
  if (!node.parentElement?.closest('script,style')) node.textContent = node.textContent.replaceAll('Tavi', appName);
}
document.title = appName;
document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute('content', appName);
for (const node of document.querySelectorAll('[aria-label],[placeholder]')) {
  for (const attr of ['aria-label','placeholder']) if (node.hasAttribute(attr)) node.setAttribute(attr, node.getAttribute(attr).replaceAll('Tavi', appName));
}
if (appName !== 'Tavi') {
  const manifest = document.querySelector('link[rel="manifest"]');
  if (manifest) manifest.setAttribute('href', manifest.getAttribute('href').replace('.webmanifest', '.legacy.webmanifest'));
}

const el = id => document.getElementById(id);
window.gsap?.ticker.lagSmoothing(0);
const app = el('app'), avatar = el('avatar'), canvas = el('cv');
const you = el('you'), say = el('say'), hint = el('hint'), soundBtn = el('sound'), endBtn = el('end');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const now = () => performance.now() / 1000;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* Shared animation state, read by the 3D loop */
let state = 'idle', hover = false, sheetOpen = false, pulse = 0, happyUntil = 0, hopStart = -9, squash = 0, blinkNow = false;
let voiceLevel = 0; // 0..1 from the live voice audio
const pointer = { x: 0, y: 0, t: -99 };
let gesture = () => {};

/* ================= 3D character ================= */
async function init3D() {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

}

const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;

function pickVoice() {

  const score = v => (v.lang === 'en-AU' ? 40 : v.lang.startsWith('en-GB') ? 25 : 10) + (/natural|online|neural/i.test(v.name) ? 20 : 0);
  ttsVoice = vs.sort((a, b) => score(b) - score(a))[0] || null;
}

    } else if (m.type === 'show' && m.card) {
      if (!currentApproval) openSheet(m.card);
    } else if (m.type === 'notices' && m.items?.length) {
      showNotices(m.items);
    } else if (m.type === 'notice' && m.notice) {
      showNotices([m.notice]);
    } else if (m.type === 'name') {
      setName(m.name);
    } else if (m.type === 'approval' && m.approval) {
      openApproval(m.approval);
    } else if (m.type === 'outcome' && m.outcome) {
      const o = m.outcome;

      line(o.message);

    } else if (m.type === 'heard' && m.text) {
      you.textContent = `“${m.text}”`;
    } else if (m.type === 'brain') {

      } else if (m.phase === 'done') {

        if (m.card) openSheet(m.card);
        if (m.source === 'typed' && liveState !== 'on') speakLocal(m.spoken).then(() => setState('idle'));
        else if (m.source === 'typed') line(m.spoken);

      } else if (m.phase === 'error') {

    // iPhone: ask for the mic first, inside the tap, before any other await.
    const micRequest = navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    audioCtx = audioCtx || new AudioContext();
    audioCtx.resume().catch(() => {});
    mic = await micRequest;
    pc = new RTCPeerConnection();
    pc.addEventListener('track', e => {
      const stream = e.streams[0] || new MediaStream([e.track]);
      remoteAudio.srcObject = stream; remoteAudio.muted = !soundOn;
      remoteAudio.play().catch(() => {});
      hookAnalyser(stream);
    });
    for (const t of mic.getAudioTracks()) pc.addTrack(t, mic);
    dc = pc.createDataChannel('oai-events');
    dc.addEventListener('message', ev => { try { onLive(JSON.parse(ev.data)); } catch {} });
    pc.addEventListener('connectionstatechange', () => {
      if (pc && ['failed', 'closed'].includes(pc.connectionState)) hangUp('Lost the voice connection. Tap me to reconnect.');
    });
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIce(pc);
    const r = await fetch('/api/session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sdp: pc.localDescription.sdp }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `Voice session failed (${r.status})`);
    await pc.setRemoteDescription({ type: 'answer', sdp: data.transport.sdp });
    liveState = 'on'; muted = false; lastActivity = now();
    endBtn.hidden = false;
    you.textContent = '';
    line('Go ahead.');
    setState('listening');
  } catch (err) {
    console.warn(err);
    hangUp(err.name === 'NotAllowedError'
      ? 'I need the microphone. On iPhone: Settings, then your browser, then turn Microphone on. Then reload and tap me.'
      : (err.message || 'Could not start the voice.'));
  }
}
function hangUp(message) {
  try { if (dc?.readyState === 'open') dc.send(JSON.stringify({ type: 'session.close', event_id: 'close' })); } catch {}
  try { pc?.close(); } catch {}
  mic?.getTracks().forEach(t => t.stop());
  pc = dc = mic = null; analyser = null; voiceLevel = 0;
  if (liveState !== 'off') fetch('/api/session/close', { method: 'POST' }).catch(() => {});
  liveState = 'off'; endBtn.hidden = true;
  setState('idle');
  if (message) line(message);
}
function setMuted(m) {
  muted = m;
  sendLive({ type: m ? 'session.input_audio.mute' : 'session.input_audio.unmute' });
  mic?.getAudioTracks().forEach(t => { t.enabled = !m; });
  if (state !== 'thinking' && state !== 'speaking') setState(m ? 'muted' : 'listening');
}
function onLive(e) {
  const t = now();
  if (e.type === 'session.input_transcript.delta') {
    lastActivity = t;
    if (t - userAt > 1.5) userLine = '';
    userLine += e.delta || ''; userAt = t;
    you.textContent = `“${userLine.trim()}”`;
  } else if (e.type === 'session.output_transcript.delta') {
    lastActivity = t;
    if (t - botAt > 1.5) botLine = '';
    botLine += e.delta || ''; botAt = t;
    line(botLine.trim());
  } else if (e.type === 'session.delegation.created') {
    brainBusy = true;
  } else if (e.type === 'session.closed') {
    hangUp(e.reason === 'expired' ? 'Session timed out. Tap me to start again.' : undefined);
  } else if (e.type === 'error') {
    console.warn('live error', e);
  }
}
// Speaking detection, mouth level and idle hang-up
setInterval(() => {
  if (liveState !== 'on') { voiceLevel = 0; return; }
  const lvl = readLevel();
  voiceLevel = lvl;
  const t = now();
  if (lvl > 0.03) {
    lastVoice = t; lastActivity = t;
    if (state !== 'speaking') setState('speaking');
  } else if (state === 'speaking' && t - lastVoice > 0.7) {
    setState(brainBusy ? 'thinking' : (muted ? 'muted' : 'listening'));
  }
  if (!brainBusy && t - lastActivity > IDLE_HANGUP_S) hangUp('Hung up to save credit. Tap me to start again.');
}, 80);

avatar.addEventListener('click', () => {
  // A card on screen stays put while you talk (it's above the fold now); Done or a swipe puts it away.
  if (liveState === 'off') {
    if (!voiceReady) { line("My voice isn't set up yet. Add the OpenAI key to .env, restart me, then tap again. You can type in the meantime."); return; }
    connectVoice();
  } else if (liveState === 'on') {
    setMuted(!muted);
  }
});
endBtn.addEventListener('click', () => hangUp('Bye for now. Tap me when you need me.'));

/* ================= phone alerts (Web Push) ================= */
const alertsBtn = el('alerts');
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64ToBytes = s => { const p = '='.repeat((4 - s.length % 4) % 4); const raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, c => c.charCodeAt(0)); };
function updateAlertsPill() {
  alertsBtn.hidden = pushSupported ? Notification.permission === 'granted' : !(isIOS && !standalone);
}
async function subscribePush() {
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    const { key } = await (await fetch('/api/push/key')).json();
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
  }
  await fetch('/api/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });
}
alertsBtn.addEventListener('click', async () => {
  if (!pushSupported) {
    line('For alerts on iPhone: tap Share, then Add to Home Screen. Open me from the Home Screen and tap Alerts.');
    return;
  }
  const perm = await Notification.requestPermission(); // must be the first thing in the tap
  if (perm !== 'granted') { line('No worries, alerts are off. You can switch them on later in your iPhone settings.'); updateAlertsPill(); return; }
  try { await subscribePush(); line("Done. I'll tap you on the shoulder when something needs you."); }
  catch (e) { console.warn(e); line("Couldn't switch alerts on just now. Try again in a sec."); }
  updateAlertsPill();
});
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(() => {
    if (pushSupported && Notification.permission === 'granted') subscribePush().catch(() => {}); // keep the PC's copy fresh
  }).catch(e => console.warn('service worker', e));
}
updateAlertsPill();

/* ================= typing ================= */
const typeBtn = el('type'), typebar = el('typebar'), tbInput = el('tb-in'), tbSend = el('tb-send');
function setTyping(on) {
  document.body.classList.toggle('typing', on);
  typebar.inert = !on;
  typeBtn.textContent = on ? 'Close' : 'Type';
  typeBtn.setAttribute('aria-expanded', String(on));
  if (on) setTimeout(() => tbInput.focus({ preventScroll: true }), 300);
  else tbInput.blur();
}
typeBtn.addEventListener('click', () => setTyping(!document.body.classList.contains('typing')));
tbInput.addEventListener('input', () => { tbSend.disabled = !tbInput.value.trim(); });
tbInput.addEventListener('keydown', e => { if (e.key === 'Escape') setTyping(false); });
typebar.addEventListener('submit', e => {
  e.preventDefault();
  const v = tbInput.value.trim();
  if (!v || brainBusy || gw?.readyState !== WebSocket.OPEN) return;
  tbInput.value = ''; tbSend.disabled = true;
  you.textContent = `“${v}”`;
  gw.send(JSON.stringify({ type: 'typed', text: v }));
});

setState('idle');
</script>
